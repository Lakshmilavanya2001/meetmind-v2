<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>Settings · MeetMind</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
<header class="app-top">
  <a class="brand" href="/dashboard">MeetMind <span class="who" id="org-name"></span></a>
  <span class="row"><a class="btn ghost small" href="/dashboard">Meetings</a><span class="who" id="me-name"></span></span>
</header>
<main class="dash">
  <p id="note" class="card" role="status" hidden style="padding:12px 18px"></p>

  <section class="card" aria-labelledby="profile-h">
    <h2 id="profile-h">Profile</h2>
    <form id="profile-form">
      <div class="row">
        <div class="field"><label for="p-name">Name</label><input id="p-name" required maxlength="80" autocomplete="name"></div>
        <div class="field"><label for="p-tz">Time zone</label><select id="p-tz"></select></div>
        <div class="field"><label for="p-lang">Preferred language</label><select id="p-lang"></select></div>
      </div>
      <p class="hint">The assistant uses your time zone for dates and times, and answers in your preferred language.</p>
      <div class="row" style="margin-top:12px"><button class="btn primary" type="submit">Save</button><span id="profile-saved" class="hint" role="status"></span></div>
    </form>
  </section>

  <section class="card" aria-labelledby="uber-h">
    <h2 id="uber-h" class="row" style="align-items:center">Uber <span id="uber-badge" class="badge" hidden></span></h2>
    <p class="hint" id="uber-about">Connect your Uber account and the assistant shows Uber's real options and fares, and books rides after you confirm.</p>
    <div id="uber-state" class="row" style="justify-content:space-between;align-items:center;margin-top:12px"><span class="meta">Loading…</span></div>
  </section>

  <section class="card" id="rides-card" hidden aria-labelledby="rides-h">
    <h2 id="rides-h">Your Uber rides</h2>
    <ul class="meetings" id="rides"></ul>
  </section>
  <p id="err" class="error" role="alert" hidden></p>
</main>
<script src="/common.js"></script>
<script src="/settings.js"></script>
</body>
</html>
