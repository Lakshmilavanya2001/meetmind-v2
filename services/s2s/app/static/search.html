<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>Search · MeetMind</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@400;600&display=swap">
  <link rel="stylesheet" href="/style.css">
</head>
<body class="app">
<nav id="app-nav" data-page="search"></nav>
<main class="page">
  <header class="page-head">
    <div><h1>Search</h1><p class="page-sub">Ask a question across the saved transcripts of your meetings.</p></div>
  </header>
  <section class="card">
    <h2>Ask about your meetings</h2>
    <p class="hint">Answers come only from the saved transcripts of meetings you took part in, with the lines they're based on.</p>
    <form id="ask-form" class="row"><div class="field"><label for="question">Question</label><input id="question" maxlength="500" placeholder="When is the Whitefield upgrade report due?"></div>
      <button class="btn primary" type="submit">Ask</button></form>
    <div id="answer"></div>
  </section>
  <p id="err" class="error" role="alert" hidden></p>
</main>
<script src="/shell.js"></script>
<script src="/common.js"></script>
<script src="/search.js"></script>
</body>
</html>
